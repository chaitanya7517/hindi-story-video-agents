<html><head><meta charset="utf-8"><title>Mithi Animation</title>
<style>
@font-face{font-family:Baloo;font-weight:700;src:url(/assets/fonts/baloo-2-devanagari-700-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Baloo;font-weight:800;src:url(/assets/fonts/baloo-2-devanagari-800-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Baloo;font-weight:700;src:url(/assets/fonts/baloo-2-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Baloo;font-weight:800;src:url(/assets/fonts/baloo-2-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#000}

</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ===== Animation agent output: draws any moment of the film with drawFrame(t) =====
// Deterministic: everything depends only on time t (seconds), so every frame renders the same way twice.
const W = 1920, H = 1080;
const main = document.getElementById('c');
const mainCtx = main.getContext('2d');
let ctx = mainCtx;
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const bufA = mk(), bufB = mk();
let TL = null, SHOTS = [], TITLE = '', MORAL = '', END = 0;

// ---------- small helpers ----------
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(42);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function circ(x, y, r, f) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = f; ctx.fill(); }
function ell(x, y, rx, ry, f, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(rx, .1), Math.max(ry, .1), rot, 0, Math.PI * 2); ctx.fillStyle = f; ctx.fill(); }
function rect(x, y, w, h, f) { ctx.fillStyle = f; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, f) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = f; ctx.fill(); }
function poly(p, f) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); ctx.fillStyle = f; ctx.fill(); }
function line(x1, y1, x2, y2, w, c) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.stroke(); }
function lg(x1, y1, x2, y2, stops) { const g = ctx.createLinearGradient(x1, y1, x2, y2); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function light(x, y, r, rgb, a) { // additive glow
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.4, `rgba(${rgb},${a * 0.35})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function shade(a, rgb = '12,18,52') { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(${rgb},${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
// arm: shoulder -> elbow -> hand, sleeve on upper part
// Arm = upper arm + elbow + forearm + hand. The elbow is solved from fixed bone lengths
// (two-bone IK), so arms never stretch or bend the wrong way.
function arm(sx, sy, hx, hy, bend, sleeve, skin, w, handR, len, sleeveTo = 1) {
  const a = len * 0.52, b = len * 0.48;
  let dx = hx - sx, dy = hy - sy, d = Math.hypot(dx, dy) || 1;
  const ux = dx / d, uy = dy / d; d = Math.min(d, a + b - 0.5);
  hx = sx + ux * d; hy = sy + uy * d;
  const A = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1)) * (bend >= 0 ? 1 : -1);
  const ex = sx + (ux * Math.cos(A) - uy * Math.sin(A)) * a, ey = sy + (ux * Math.sin(A) + uy * Math.cos(A)) * a;
  const skinD = shadeCol(skin);
  // forearm (tapers to the wrist)
  limb(ex, ey, hx, hy, w * 0.78, w * 0.6, skin);
  // sleeve over upper arm (and part of forearm for long sleeves)
  const cx = lerp(ex, hx, Math.max(0, sleeveTo - 1)), cy = lerp(ey, hy, Math.max(0, sleeveTo - 1));
  limb(sx, sy, ex, ey, w * 1.05, w * 0.95, sleeve);
  if (sleeveTo > 1) limb(ex, ey, cx, cy, w * 0.95, w * 0.9, sleeve);
  circ(sleeveTo > 1 ? cx : ex, sleeveTo > 1 ? cy : ey, w * 0.47, sleeve);
  hand(hx, hy, Math.atan2(hy - ey, hx - ex), handR, skin, skinD, bend >= 0 ? 1 : -1);
  return [hx, hy];
}
function limb(x1, y1, x2, y2, w1, w2, col) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
  ctx.beginPath(); ctx.moveTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2); ctx.lineTo(x2 + nx * w2 / 2, y2 + ny * w2 / 2);
  ctx.lineTo(x2 - nx * w2 / 2, y2 - ny * w2 / 2); ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); circ(x1, y1, w1 / 2, col); circ(x2, y2, w2 / 2, col);
}
function hand(x, y, ang, r, skin, skinD, side) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ell(r * .55, 0, r * 1.05, r * .78, skin);                          // palm
  ell(r * .35, side * r * .72, r * .5, r * .26, skin, side * .7);     // thumb
  ctx.strokeStyle = skinD; ctx.lineWidth = Math.max(1, r * .12); ctx.lineCap = 'round';
  for (const k of [-.32, 0, .32]) { ctx.beginPath(); ctx.moveTo(r * 1.15, k * r); ctx.lineTo(r * 1.5, k * r * 1.1); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(r * .55, 0, r * 1.05, r * .78, 0, -1.2, 1.2); ctx.stroke(); // finger tips edge
  ctx.restore();
}
function shadeCol(hex) { const n = parseInt(hex.slice(1), 16); const f = c => Math.round(c * .82); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
function heart(x, y, s, c) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6); ctx.fillStyle = c; ctx.fill(); ctx.restore(); }
function sparkle(x, y, r, a) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,226,140,${a})`; ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill(); ctx.restore(); }

// ---------- fixed random data (same every run) ----------
const STARS = [...Array(170)].map(() => ({ x: R() * W, y: R() * 560, r: .6 + R() * 1.8, p: R() * 6.3 }));
const FLIES = [...Array(16)].map(() => ({ x: 80 + R() * 1760, y: 520 + R() * 420, p: R() * 6.3, s: .25 + R() * .4 }));
const DUST = [...Array(40)].map(() => ({ x: R(), y: R(), p: R() * 6.3 }));
const SPECKS = [...Array(14)].map(() => ({ x: (R() - .5) * 70, y: -20 - R() * 100, p: R() * 6.3 }));
const FLOWERS = [...Array(16)].map(() => ({ x: (R() - .5) * 90, y: R(), c: R() < .5 ? '#fff4d6' : '#e0602a' }));
const BULBS = ['255,90,90', '255,210,80', '120,220,120', '110,170,255', '255,140,220'];

// ---------- characters ----------
function mithi(x, y, s, o = {}) {
  const t = o.t || 0, pose = o.pose || 'stand', sit = ['sit', 'shape', 'hold'].includes(pose);
  const skin = '#c98a5e', skinD = '#ad6f47', kurti = '#ecb22e', kurtiD = '#c98d18', pant = '#6e7b2d', hair = '#1c1411', red = '#d8262e';
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  const bob = o.walk ? -Math.abs(Math.sin(t * 8)) * 7 : Math.sin(t * 2.2) * 1.5;
  const by = sit ? 70 : 0, hy = -262 + by + bob, top = -215 + by + bob;
  ell(0, 2, sit ? 100 : 62, 12, 'rgba(0,0,0,0.25)');
  for (const sx of [-1, 1]) { // braids + red ribbons
    for (let k = 0; k < 5; k++) ell(sx * 50, hy + 22 + k * 19, 11, 12, hair);
    ell(sx * 50 - 9, hy + 120, 12, 7, red, -0.5); ell(sx * 50 + 9, hy + 120, 12, 7, red, 0.5); circ(sx * 50, hy + 120, 5, '#a8161d');
  }
  if (!sit) {
    const sw = o.walk ? Math.sin(t * 8) * 8 : 0;
    rrect(-30 + sw, -116 + bob, 24, 112, 10, pant); rrect(6 - sw, -116 + bob, 24, 112, 10, pant);
    ell(-18 + sw, -3, 18, 7, '#7a4526'); ell(18 - sw, -3, 18, 7, '#7a4526');
  } else { ell(0, -30, 98, 34, pant); ell(-62, -16, 22, 11, skin); ell(62, -16, 22, 11, skin); }
  const hem = sit ? -48 : -92 + bob;
  ctx.beginPath(); ctx.moveTo(-36, top); ctx.quadraticCurveTo(-48, top + 40, -60, hem); ctx.lineTo(60, hem); ctx.quadraticCurveTo(48, top + 40, 36, top); ctx.closePath();
  ctx.fillStyle = lg(-60, 0, 60, 0, [[0, kurtiD], [.35, kurti], [.7, kurti], [1, kurtiD]]); ctx.fill();
  for (const f of FLOWERS) { const fy = lerp(top + 25, hem - 10, f.y); if (Math.abs(f.x) < 30 + (fy - top) * .22) { for (let k = 0; k < 5; k++) circ(f.x + Math.cos(k * 1.26) * 3.2, fy + Math.sin(k * 1.26) * 3.2, 2, f.c); circ(f.x, fy, 1.6, '#c0392b'); } }
  rect(-12, top - 20, 24, 26, skinD); poly([-14, top, 14, top, 0, top + 18], kurtiD);
  // arms (by pose)
  const L = [-36, top + 10], Rr = [36, top + 10]; let hl, hr, bl = 10, br = -10;
  if (pose === 'point') { hl = [-50, top + 110]; hr = [o.pointDir < 0 ? -118 : 118, top + 2]; br = o.pointDir < 0 ? 30 : -20; if (o.pointDir < 0) { hl = [50, top + 110]; bl = -10; } }
  else if (pose === 'shape') { const m = Math.sin(t * 5) * 6; hl = [-24, top + 118 + m]; hr = [24, top + 118 - m]; bl = 22; br = -22; }
  else if (pose === 'hold') { hl = [-22, top + 112]; hr = [22, top + 112]; bl = 26; br = -26; }
  else if (pose === 'hug') { hl = [-84, top + 70]; hr = [-70, top + 96]; bl = -16; br = 20; }
  else if (o.talk) { hl = [-50, top + 110]; hr = [58 + Math.sin(t * 2.6) * 8, top + 46 + Math.sin(t * 3.3) * 12]; br = 20; }
  else { hl = [-50 + Math.sin(t * 1.1) * 2, top + 110]; hr = [50 - Math.sin(t * 1.3) * 2, top + 110]; }
  arm(L[0], L[1], hl[0], hl[1], bl, kurtiD, skin, 17, 9, 104, 1.45);
  if (o.item === 'clay') { ell(0, top + 132, 34, 18, '#8d8378'); ell(-6, top + 124, 20, 9, '#a0968a'); }
  if (o.item === 'diya') diya(0, top + 120, .9, { crooked: true, t });
  const ph = arm(Rr[0], Rr[1], hr[0], hr[1], br, kurtiD, skin, 17, 9, 104, 1.45);
  if (pose === 'point') line(ph[0], ph[1], ph[0] + (o.pointDir < 0 ? -20 : 20), ph[1] - 4, 4.5, skin); // index finger
  // head
  ell(0, hy - 6, 58, 58, hair); circ(-49, hy + 4, 9, skin); circ(49, hy + 4, 9, skin);
  circ(-50, hy + 16, 4, '#f2c14e'); circ(50, hy + 16, 4, '#f2c14e');
  circ(0, hy, 50, skin);
  ctx.beginPath(); ctx.moveTo(-52, hy); ctx.quadraticCurveTo(-52, hy - 64, 0, hy - 58); ctx.quadraticCurveTo(52, hy - 64, 52, hy); ctx.quadraticCurveTo(34, hy - 36, 4, hy - 34); ctx.quadraticCurveTo(-30, hy - 38, -52, hy); ctx.fillStyle = hair; ctx.fill();
  circ(0, hy - 21, 3.6, '#c0182a');
  const blink = (t + (o.seed || 0)) % 3.9 < 0.13, lk = (o.look || 0) * 3;
  for (const sx of [-1, 1]) {
    if (blink) line(sx * 19 - 8, hy + 4, sx * 19 + 8, hy + 4, 3, '#2a160c');
    else { ell(sx * 19 + lk, hy + 4, 8.5, 11, '#2a160c'); circ(sx * 19 + lk + 3, hy - 1, 3, '#fff'); circ(sx * 19 + lk - 2, hy + 8, 1.4, '#fff'); }
    const wr = o.mood === 'worried' ? sx * 0.25 : -sx * 0.05;
    ctx.save(); ctx.translate(sx * 20, hy - 14); ctx.rotate(wr); line(-9, 0, 9, 0, 3, '#2a160c'); ctx.restore();
    circ(sx * 31, hy + 21, 9, 'rgba(240,96,110,0.35)');
  }
  ctx.beginPath(); ctx.arc(0, hy + 12, 5, 0.2, Math.PI - 0.2); ctx.strokeStyle = skinD; ctx.lineWidth = 2.5; ctx.stroke();
  if (o.talk) { const op = 2 + Math.abs(Math.sin(t * 15)) * 5; ctx.beginPath(); ctx.moveTo(-11, hy + 25); ctx.quadraticCurveTo(0, hy + 28, 11, hy + 25); ctx.quadraticCurveTo(8, hy + 28 + op * 1.6, 0, hy + 29 + op * 1.6); ctx.quadraticCurveTo(-8, hy + 28 + op * 1.6, -11, hy + 25); ctx.fillStyle = '#7a1f22'; ctx.fill(); ell(0, hy + 27 + op * 1.2, 5, op * .45, '#e0757a'); }
  else { ctx.beginPath(); if (o.mood === 'worried') ctx.arc(0, hy + 40, 9, Math.PI + .5, -.5); else ctx.arc(0, hy + 24, 11, .35, Math.PI - .35); ctx.strokeStyle = '#7a1f22'; ctx.lineWidth = 3.5; ctx.stroke(); }
  ctx.restore();
}

function papa(x, y, s, o = {}) {
  const t = o.t || 0, pose = o.pose || 'stand';
  const skin = '#a86a43', skinD = '#8c5533', kurta = '#e8d9b8', kurtaD = '#c8b690', dhoti = '#6b4328', dhotiL = '#7d5133', hair = '#1b1715';
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  const breathe = Math.sin(t * 2) * 2, tired = o.tired ? 12 : 0;
  let top, hem, hy;
  ell(0, 2, 120, 16, 'rgba(0,0,0,0.25)');
  if (pose === 'wheel' || pose === 'pat') {
    rrect(-60, -70, 120, 70, 8, '#6d4a2e'); rect(-60, -70, 120, 10, '#86603e');
    ell(-50, -96, 46, 32, dhotiL); ell(50, -96, 46, 32, dhotiL);
    rrect(-80, -96, 30, 92, 12, dhoti); rrect(50, -96, 30, 92, 12, dhoti);
    ell(-66, -4, 26, 9, skinD); ell(66, -4, 26, 9, skinD);
    top = -320 + tired + breathe; hem = -110; hy = top - 62 + tired * .6;
  } else if (pose === 'kneel' || pose === 'place' || pose === 'hug') {
    ell(-92, -6, 22, 8, skinD);                          // back foot (behind the kneeling leg)
    limb(-34, -82, -44, -14, 56, 44, dhoti);              // left thigh down to the knee on the ground
    ell(-60, -12, 40, 14, dhotiL);                        // shin lying on the ground
    limb(30, -82, 74, -104, 54, 46, dhotiL);              // right thigh forward to the raised knee
    limb(74, -104, 78, -8, 44, 34, dhoti);                // right shin down to the foot
    ell(86, -4, 26, 9, skinD);
    top = -300 + breathe; hem = -78; hy = top - 62;
  } else {
    rrect(-52, -235, 104, 232, 20, dhoti); line(0, -220, 0, -10, 4, dhotiL);
    ell(-26, -4, 24, 9, skinD); ell(26, -4, 24, 9, skinD);
    top = -440 + breathe; hem = -210; hy = top - 62;
  }
  const lean = o.lean || 0;
  if (lean) { ctx.translate(0, hem); ctx.rotate(lean); ctx.translate(0, -hem); }
  ctx.beginPath(); ctx.moveTo(-58, top); ctx.quadraticCurveTo(-74, top + 70, -72, hem); ctx.lineTo(72, hem); ctx.quadraticCurveTo(74, top + 70, 58, top); ctx.closePath();
  ctx.fillStyle = lg(-72, 0, 72, 0, [[0, kurtaD], [.3, kurta], [.7, kurta], [1, kurtaD]]); ctx.fill();
  for (const [cx, cy, r] of [[-30, 60, 14], [24, 110, 18], [-12, 150, 10], [40, 40, 9]]) if (top + cy < hem) ell(cx, top + cy, r, r * .7, 'rgba(120,112,100,0.35)');
  line(0, top + 6, 0, top + 70, 3, kurtaD);
  rect(-16, top - 22, 32, 28, skinD);
  const L = [-56, top + 14], Rr = [56, top + 14]; let hl = [-74, top + 216], hr = [74, top + 216], bl = 14, br = -14;
  if (pose === 'wheel') { const m = Math.sin(t * 3) * 4; hl = [96, top + 226 + m]; hr = [176, top + 220 - m]; bl = -30; br = -30; }
  else if (pose === 'pat') { hl = [-74, top + 216]; hr = o.hand || [150, top + 60]; br = -30; }
  else if (pose === 'place') { hl = [-74, top + 216]; hr = o.hand || [130, top + 270]; br = -20; }
  else if (pose === 'hug') { hl = [-74, top + 216]; hr = [104, top + 128]; br = 30; }
  const hip = [0, hem];
  const toBody = p => { if (!lean) return p; const c = Math.cos(-lean), sn = Math.sin(-lean), x = p[0] - hip[0], y = p[1] - hip[1]; return [hip[0] + x * c - y * sn, hip[1] + x * sn + y * c]; };
  hl = toBody(hl); hr = toBody(hr);
  arm(L[0], L[1], hl[0], hl[1], bl, kurtaD, skin, 24, 12, 214, 1.0);
  if (o.carry) diya(hr[0] + 6, hr[1] - 10, 1, { crooked: true, t });
  arm(Rr[0], Rr[1], hr[0], hr[1], br, kurtaD, skin, 24, 12, 214, 1.0);
  // head
  circ(-57, hy + 6, 11, skin); circ(57, hy + 6, 11, skin);
  circ(0, hy, 60, skin);
  ell(0, hy - 42, 62, 30, hair);
  for (let k = -4; k <= 4; k++) poly([k * 13 - 8, hy - 50, k * 13 + 8, hy - 50, k * 13 + 3, hy - 76 + Math.abs(k) * 3], hair);
  for (const gx of [-40, -18, 30]) line(gx, hy - 58, gx + 10, hy - 36, 2, '#8d8d8d');
  ell(-52, hy - 12, 9, 22, hair); ell(52, hy - 12, 9, 22, hair);
  const blink = (t + 1.3) % 4.4 < 0.14 || o.sleep;
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 23, hy - 18); ctx.rotate(o.tired ? sx * .18 : -sx * .05); line(-12, 0, 12, 0, 6, hair); ctx.restore();
    if (blink) line(sx * 23 - 9, hy + 2, sx * 23 + 9, hy + 2, 3.5, '#24140b');
    else { ell(sx * 23, hy + 2, 7, 8.5, '#24140b'); circ(sx * 23 + 2.5, hy - 1.5, 2.4, '#fff'); if (o.tired) rect(sx * 23 - 9, hy - 8, 18, 7, skin); }
    line(sx * 34, hy + 10, sx * 40, hy + 14, 1.5, skinD);
  }
  ctx.beginPath(); ctx.moveTo(-3, hy - 2); ctx.quadraticCurveTo(-10, hy + 20, 0, hy + 20); ctx.strokeStyle = skinD; ctx.lineWidth = 3; ctx.stroke();
  if (o.talk) { const op = 3 + Math.abs(Math.sin(t * 15)) * 8; ell(0, hy + 40, 11, op, '#5e1a17'); }
  else if (o.tired) line(-10, hy + 42, 10, hy + 42, 3.5, '#5e1a17');
  else { ctx.beginPath(); ctx.arc(0, hy + 30, 14, .4, Math.PI - .4); ctx.strokeStyle = '#5e1a17'; ctx.lineWidth = 4; ctx.stroke(); }
  ell(-15, hy + 27, 20, 8, hair, 0.25); ell(15, hy + 27, 20, 8, hair, -0.25);
  if (o.tired) { ctx.beginPath(); ctx.moveTo(50, hy - 30); ctx.quadraticCurveTo(58, hy - 16, 50, hy - 12); ctx.quadraticCurveTo(42, hy - 16, 50, hy - 30); ctx.fillStyle = 'rgba(170,215,255,0.85)'; ctx.fill(); }
  ctx.restore();
}

function owl(x, y, s, o = {}) {
  const t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(o.tilt || 0);
  const white = '#f7f4ee', shadeW = '#e3ddd2';
  if (o.fly) {
    const f = Math.sin(t * 9);
    for (const sx of [-1, 1]) {
      ctx.save(); ctx.translate(sx * 40, -80); ctx.rotate(sx * (-0.5 + f * 0.6));
      ell(sx * 75, 0, 85, 28, shadeW); ell(sx * 70, -6, 70, 20, white);
      for (let k = 0; k < 5; k++) ell(sx * (120 + k * 4), 6 + k * 5, 26, 8, '#d9d2c4', sx * 0.3);
      ctx.restore();
    }
  } else { ell(-48, -60, 24, 58, shadeW, .12); ell(48, -60, 24, 58, shadeW, -.12); }
  ell(0, -64, 56, 72, white);
  ctx.fillStyle = lg(0, -130, 0, 0, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(120,110,95,0.18)']]); ctx.beginPath(); ctx.ellipse(0, -64, 56, 72, 0, 0, 7); ctx.fill();

    const ign = sh.lines[1] ? sh.lines[1].start : sh.start + 6, gk = ease((T - ign) / 2.5);

    const pk = ease((lt - 3) / 3), back = ease((lt - 7) / 1.5); // bend down, place the diya, straighten up
    const lean = .42 * ease((lt - 2.5) / 2) * (1 - back);
    const carry = [70, -250], ground = [146, -26], rest = [74, -86];
    const hand = pk < 1 ? [lerp(carry[0], ground[0], pk), lerp(carry[1], ground[1], pk)] : [lerp(ground[0], rest[0], back), lerp(ground[1], rest[1], back)];
    papa(820, 850, 1, { pose: 'place', t: T, hand, carry: pk < 1, lean });
    if (pk >= 1) diya(960, 832, 1, { crooked: true, lit: T > ign, t: T, flame: 1 + gk * .6 });
    mithi(1150, 850, .95, { look: -1, t: T });
    streetLights(T, gk, 0); magicGlow(960, 815, gk * .7, T);
  } },
  s08: { cam: [1000, 640], draw(lt, sh, T) {
    streetScene(T, 1, .3);
    diya(960, 832, 1, { crooked: true, lit: true, t: T, flame: 1.6 });
    const sp = speaker(T);
    mithi(1230, 850, .95, { pose: 'hug', t: T, talk: sp === 'Mithi' });
    papa(1090, 850, 1, { pose: 'hug', t: T, talk: sp === 'Papa' }); // hand on her near shoulder
    streetLights(T, 1, .3); magicGlow(960, 815, .5, T);
  } },
  s09: { cam: [960, 560], draw(lt, sh, T) {
    streetScene(T, 1, 1);
    for (let k = 0; k < 9; k++) { diya(120 + k * 210, 1010, .8, { lit: true, t: T + k }); }
    diya(960, 832, 1, { crooked: true, lit: true, t: T, flame: 1.6 });
    papa(1080, 850, .9, { t: T }); mithi(1200, 850, .85, { t: T, look: -1 });
    streetLights(T, 1, 1); magicGlow(960, 815, .5, T);
    for (let k = 0; k < 9; k++) light(160 + k * 210, 990, 90, '255,190,90', .45);
  } },
};
function potteryLight(T) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = lg(300, 300, 900, 1080, [[0, 'rgba(255,230,160,0.22)'], [1, 'rgba(255,230,160,0)']]);
  ctx.beginPath(); ctx.moveTo(200, 330); ctx.lineTo(480, 240); ctx.lineTo(1250, 1080); ctx.lineTo(560, 1080); ctx.fill(); ctx.restore();
  for (const d of DUST) { const x = lerp(320, 900, d.y) + Math.sin(T * .3 + d.p) * 60 + d.x * 200, y = lerp(330, 1000, d.y) + Math.sin(T * .2 + d.p) * 30; circ(x, y, 2, `rgba(255,245,210,${.35 + .3 * Math.sin(T + d.p)})`); }
}

// ---------- timing ----------
function speaker(T) { for (const s of SHOTS) for (const l of s.lines) if (T >= l.start && T <= l.end) return l.speaker; return null; }
function shotAt(T) { let i = 0; for (let k = 0; k < SHOTS.length; k++) if (T >= SHOTS[k].start) i = k; return i; }
function camera(i, T) {
  const sh = SHOTS[i], sc = SCENES[sh.id], z = sc.zoom || 1, mv = sh.camera;
  const p = ease((T - sh.start) / (sh.end - sh.start));
  let s = z, dx = 0; const [fx, fy] = sc.cam;
  if (mv === 'zoom_in') s = z * lerp(1.0, 1.12, p);
  else if (mv === 'zoom_out') s = z * lerp(1.14, 1.0, p);
  else { s = z * 1.1; dx = (mv === 'pan_right' ? 1 : -1) * lerp(-70, 70, p); }
  // keep focus point near centre but never show past the picture edges
  let tx = W / 2 - (fx + dx) * s, ty = H / 2 - fy * s;
  tx = Math.min(0, Math.max(W - W * s, tx)); ty = Math.min(0, Math.max(H - H * s, ty));
  return [s, tx, ty];
}
function renderShot(i, T, target) {
  const old = ctx; ctx = target.getContext('2d');
  const sh = SHOTS[i], [s, tx, ty] = camera(i, T);
  ctx.setTransform(s, 0, 0, s, tx, ty);
  SCENES[sh.id].draw(T - sh.start, sh, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx = old;
}

// ---------- subtitles, title, moral ----------
const HI_NAME = { Mithi: 'मिठी', Papa: 'पापा', Uluka: 'उलूका' };
const NAME_COL = { Mithi: '#ffd166', Papa: '#9be7a5', Uluka: '#9fd3ff' };
function chunks(text) { const w = text.split(' '), out = []; let cur = ''; for (const x of w) { if ((cur + ' ' + x).trim().length > 46 && cur) { out.push(cur.trim()); cur = x; } else cur += ' ' + x; } if (cur.trim()) out.push(cur.trim()); return out; }
function subtitle(T) {
  for (const s of SHOTS) for (const l of s.lines) {
    if (T < l.start - .1 || T > l.end + .25) continue;
    if (l === LAST_LINE) return;
    const cs = chunks(l.text), tot = cs.reduce((a, c) => a + c.length, 0); let acc = l.start, part = cs[cs.length - 1];
    for (const c of cs) { const d = (l.end - l.start) * c.length / tot; if (T < acc + d) { part = c; break; } acc += d; }
    const name = HI_NAME[l.speaker];
    ctx.font = '700 54px Baloo'; const label = name ? name + ': ' : ''; ctx.font = '800 54px Baloo';
    const lw = ctx.measureText(label).width; ctx.font = '700 54px Baloo'; const tw = ctx.measureText(part).width + lw;
    rrect(W / 2 - tw / 2 - 34, 950, tw + 68, 88, 22, 'rgba(10,8,20,0.62)');
    let x = W / 2 - tw / 2; ctx.textBaseline = 'middle';
    if (label) { ctx.font = '800 54px Baloo'; ctx.fillStyle = NAME_COL[l.speaker]; ctx.fillText(label, x, 996); x += lw; }
    ctx.font = '700 54px Baloo'; ctx.fillStyle = '#fff'; ctx.fillText(part, x, 996);
    return;
  }
}
function titleCard(T) {
  const a = T < 4.5 ? 1 : 1 - ease((T - 4.5) / 1);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 120px Baloo'; ctx.lineWidth = 14; ctx.strokeStyle = '#5a2310'; ctx.lineJoin = 'round';
  ctx.strokeText(TITLE, W / 2, 200); ctx.fillStyle = lg(0, 140, 0, 260, [[0, '#fff3b0'], [1, '#ffb43c']]); ctx.fillText(TITLE, W / 2, 200);
  ctx.restore();
}
let LAST_LINE = null;
function moralCard(T) {
  if (!LAST_LINE || T < LAST_LINE.start - .3) return;
  const a = ease((T - LAST_LINE.start + .3) / .8);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const CX = 500; rrect(CX - 430, 50, 860, 300, 40, 'rgba(255,246,224,0.94)');
  ctx.lineWidth = 8; ctx.strokeStyle = '#e08a1e'; ctx.beginPath(); ctx.roundRect(CX - 430, 50, 860, 300, 40); ctx.stroke();
  ctx.font = '800 64px Baloo'; ctx.fillStyle = '#c2410c'; ctx.fillText('सीख', CX, 108);
  ctx.font = '700 52px Baloo'; ctx.fillStyle = '#3b2412';
  let lines = [];
  for (const sent of MORAL.split(/(?<=,)\s+/)) { let cur = ''; for (const p of sent.split(' ')) { if ((cur + ' ' + p).length > 26 && cur) { lines.push(cur); cur = p; } else cur = (cur + ' ' + p).trim(); } if (cur) lines.push(cur); }
  lines.forEach((l, k) => ctx.fillText(l, CX, 180 + k * 58));
  ctx.restore();
}

// ---------- public API used by the renderer ----------
window.setup = async (d) => {
  TL = d.timeline; TITLE = d.title; MORAL = d.moral;
  const cams = Object.fromEntries(d.storyboard.shots.map(s => [s.id, s.camera]));
  SHOTS = TL.shots.map(s => ({ ...s, camera: cams[s.id] }));
  LAST_LINE = SHOTS[SHOTS.length - 1].lines.slice(-1)[0];
  END = TL.duration + 2.5;
  await document.fonts.load('700 54px Baloo', 'मिठी'); await document.fonts.load('800 54px Baloo', 'मिठी');
  await document.fonts.load('700 54px Baloo', 'abc!?'); await document.fonts.load('800 54px Baloo', 'abc');
  buildBackgrounds();
  return END;
};
const XF = 0.6; // crossfade seconds
window.drawFrame = (T) => {
  ctx = mainCtx; ctx.setTransform(1, 0, 0, 1, 0, 0);
  const i = shotAt(T), sh = SHOTS[i];
  renderShot(i, T, bufA);
  if (i > 0 && T - sh.start < XF) { renderShot(i - 1, T, bufB); ctx.drawImage(bufB, 0, 0); ctx.globalAlpha = ease((T - sh.start) / XF); ctx.drawImage(bufA, 0, 0); ctx.globalAlpha = 1; }
  else ctx.drawImage(bufA, 0, 0);
  if (T < .8) { ctx.fillStyle = `rgba(0,0,0,${1 - T / .8})`; ctx.fillRect(0, 0, W, H); }
  titleCard(T); subtitle(T); moralCard(T);
  if (T > END - 1.5) { ctx.fillStyle = `rgba(0,0,0,${ease((T - (END - 1.5)) / 1.5)})`; ctx.fillRect(0, 0, W, H); }
};
window.frame = (T, q) => { window.drawFrame(T); return main.toDataURL('image/jpeg', q || 0.92); };
</script></body></html>
